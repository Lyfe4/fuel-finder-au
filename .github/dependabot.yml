version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

    ignore:
      # @types/node tracks the Node major in .nvmrc, not the newest Node.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # typescript-eslint's peer range lags TypeScript majors.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      # 4.18 changed import-x/order's ordering of ../ and ./ in one group
      # (65 new errors, unannounced); pinned at 4.17.1 (docs/decisions.md,
      # round 19). Lift when a later version orders them as before.
      - dependency-name: 'eslint-plugin-import-x'
        versions: ['4.18.x']
      # jsdom 31.0.1 (pull request #33, closed) failed 10 unit tests: accessible
      # names that include VisuallyHidden text ("Favourite, Ampol Foodary
      # Erina") were no longer found, while the real-browser checks passed.
      # Ignored until the test setup is fixed (docs/decisions.md, Baseline
      # open items); then remove this. 32 and later are still offered.
      - dependency-name: 'jsdom'
        versions: ['31.x']

    groups:
      dev-dependencies:
        dependency-type: development
        update-types: ['minor', 'patch']
      production-dependencies:
        dependency-type: production
        update-types: ['minor', 'patch']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']

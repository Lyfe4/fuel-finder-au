name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Actions pinned to a commit, not a tag: a tag can be moved to other code
    # after review. The comment is the release; Dependabot updates both.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Round 21 (audit 3, A11): known advisories in what ships, the browser
      # bundle and the functions. Development tools are left out: the one
      # dismissed alert (minimatch, round 20) is dev-only, and a full audit
      # would fail every run on it.
      - name: Audit production dependencies
        run: pnpm audit --prod

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      # Every test runs against fixtures. None of them reaches API.NSW, so CI
      # needs no credentials.
      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # The first load held near its size, and the lazy map under a ceiling.
      - name: Bundle budget
        run: pnpm bundle:check
